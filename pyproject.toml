[build-system]
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[project]
name = "claude-managed"
version = "0.1.0"
description = "Opt-in event-driven supervision for interactive Claude Code sessions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jarvis" }]
keywords = ["claude-code", "hermes-agent", "webhook", "hooks", "agent-supervision"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.16,<0.17"]

[project.scripts]
claude-managed = "claude_managed.cli:main"

[project.urls]
Homepage = "https://github.com/jarvis-flarex/claude-managed"
Repository = "https://github.com/jarvis-flarex/claude-managed"
Issues = "https://github.com/jarvis-flarex/claude-managed/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_managed"]
